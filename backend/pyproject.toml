[project]
name = "tierforge-backend"
version = "0.1.0"
description = "TierForge backend: FastAPI API and SQS enrichment worker"
requires-python = ">=3.12,<3.14"
dependencies = ["fastapi (>=0.161.1,<0.162.0)", "uvicorn[standard] (>=0.54.0,<0.55.0)", "sqlalchemy[asyncio] (>=2.1.6,<3.0.0)", "asyncpg (>=0.32.0,<0.33.0)", "alembic (>=1.20.1,<2.0.0)", "pydantic-settings (>=2.16.1,<3.0.0)", "aiobotocore (>=3.9.2,<4.0.0)"]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-mock (>=3.17.0,<4.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "httpx2 (>=2.16.0,<3.0.0)",
    "poethepoet (>=0.49.0,<0.50.0)",
    "black (>=26.10.1,<27.0.0)",
    "isort (>=9.0.2,<10.0.0)",
    "flake8 (>=7.4.1,<8.0.0)",
    "python-dotenv (>=1.2.4,<2.0.0)"
]

[tool.poe]
envfile = ".env"
include = ["make.toml", "db.toml"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["api", "worker", "config", "scripts", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
